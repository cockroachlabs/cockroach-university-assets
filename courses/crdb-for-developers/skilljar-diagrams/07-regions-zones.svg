<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#190F33">A Multi-Region Cluster: Regions &#8594; Zones &#8594; Nodes</text>

  <!-- Region 1 -->
  <rect x="30" y="65" width="260" height="360" rx="10" fill="#F9F8F3" stroke="#6933FF" stroke-width="2"/>
  <text x="160" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#6933FF">Region: us-east</text>

  <rect x="50" y="110" width="220" height="140" rx="8" fill="#F4F2FF" stroke="#D9D6E8" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#190F33">Zone a</text>
  <circle cx="110" cy="175" r="18" fill="#3498db"/><text x="110" y="180" text-anchor="middle" font-size="11" fill="#ffffff">n1</text>
  <circle cx="210" cy="175" r="18" fill="#3498db"/><text x="210" y="180" text-anchor="middle" font-size="11" fill="#ffffff">n2</text>
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#190F33">own power &amp; network</text>

  <rect x="50" y="265" width="220" height="140" rx="8" fill="#F4F2FF" stroke="#D9D6E8" stroke-width="2"/>
  <text x="160" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#190F33">Zone b</text>
  <circle cx="160" cy="330" r="18" fill="#3498db"/><text x="160" y="335" text-anchor="middle" font-size="11" fill="#ffffff">n3</text>
  <text x="160" y="377" text-anchor="middle" font-size="11" fill="#190F33">own power &amp; network</text>

  <!-- Region 2 -->
  <rect x="320" y="65" width="260" height="360" rx="10" fill="#F9F8F3" stroke="#6933FF" stroke-width="2"/>
  <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#6933FF">Region: us-west</text>

  <rect x="340" y="110" width="220" height="140" rx="8" fill="#F4F2FF" stroke="#D9D6E8" stroke-width="2"/>
  <text x="450" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#190F33">Zone a</text>
  <circle cx="400" cy="175" r="18" fill="#3498db"/><text x="400" y="180" text-anchor="middle" font-size="11" fill="#ffffff">n4</text>
  <circle cx="500" cy="175" r="18" fill="#3498db"/><text x="500" y="180" text-anchor="middle" font-size="11" fill="#ffffff">n5</text>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#190F33">own power &amp; network</text>

  <rect x="340" y="265" width="220" height="140" rx="8" fill="#F4F2FF" stroke="#D9D6E8" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#190F33">Zone b</text>
  <circle cx="450" cy="330" r="18" fill="#3498db"/><text x="450" y="335" text-anchor="middle" font-size="11" fill="#ffffff">n6</text>
  <text x="450" y="377" text-anchor="middle" font-size="11" fill="#190F33">own power &amp; network</text>

  <!-- Region 3 -->
  <rect x="610" y="65" width="260" height="360" rx="10" fill="#F9F8F3" stroke="#6933FF" stroke-width="2"/>
  <text x="740" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#6933FF">Region: eu-west</text>

  <rect x="630" y="110" width="220" height="140" rx="8" fill="#F4F2FF" stroke="#D9D6E8" stroke-width="2"/>
  <text x="740" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#190F33">Zone a</text>
  <circle cx="690" cy="175" r="18" fill="#3498db"/><text x="690" y="180" text-anchor="middle" font-size="11" fill="#ffffff">n7</text>
  <circle cx="790" cy="175" r="18" fill="#3498db"/><text x="790" y="180" text-anchor="middle" font-size="11" fill="#ffffff">n8</text>
  <text x="740" y="222" text-anchor="middle" font-size="11" fill="#190F33">own power &amp; network</text>

  <rect x="630" y="265" width="220" height="140" rx="8" fill="#F4F2FF" stroke="#D9D6E8" stroke-width="2"/>
  <text x="740" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#190F33">Zone b</text>
  <circle cx="740" cy="330" r="18" fill="#3498db"/><text x="740" y="335" text-anchor="middle" font-size="11" fill="#ffffff">n9</text>
  <text x="740" y="377" text-anchor="middle" font-size="11" fill="#190F33">own power &amp; network</text>

  <text x="450" y="448" text-anchor="middle" font-size="13" fill="#190F33">Nodes are spread across zones within each region &#8212; the same ranges-and-replicas model still applies.</text>
