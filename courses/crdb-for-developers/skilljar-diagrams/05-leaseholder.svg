<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="sans-serif">
  <text x="450" y="34" font-size="18" font-weight="bold" fill="#190F33" text-anchor="middle">The Leaseholder Coordinates the Range</text>
  <text x="450" y="56" font-size="13" fill="#190F33" text-anchor="middle">One replica handles reads and writes; the others stay in sync</text>

  <!-- node 1: leaseholder -->
  <rect x="100" y="90" width="190" height="130" rx="10" fill="#F4F2FF" stroke="#6933FF" stroke-width="3"/>
  <text x="195" y="116" font-size="14" font-weight="bold" fill="#190F33" text-anchor="middle">Node 1</text>
  <rect x="130" y="128" width="130" height="66" rx="6" fill="#ffffff" stroke="#6933FF" stroke-width="3"/>
  <text x="195" y="150" font-size="12" font-weight="bold" fill="#6933FF" text-anchor="middle">Replica</text>
  <text x="195" y="166" font-size="12" font-weight="bold" fill="#6933FF" text-anchor="middle">LEASEHOLDER</text>
  <text x="195" y="184" font-size="11" fill="#6933FF" text-anchor="middle">serves reads &amp; writes</text>

  <!-- node 2: follower -->
  <rect x="355" y="90" width="190" height="130" rx="10" fill="#F9F8F3" stroke="#D9D6E8" stroke-width="2"/>
  <text x="450" y="116" font-size="14" font-weight="bold" fill="#190F33" text-anchor="middle">Node 2</text>
  <rect x="385" y="128" width="130" height="66" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="450" y="150" font-size="12" font-weight="bold" fill="#3498db" text-anchor="middle">Replica</text>
  <text x="450" y="166" font-size="12" fill="#3498db" text-anchor="middle">follower</text>
  <text x="450" y="184" font-size="11" fill="#3498db" text-anchor="middle">kept in sync</text>

  <!-- node 3: follower -->
  <rect x="610" y="90" width="190" height="130" rx="10" fill="#F9F8F3" stroke="#D9D6E8" stroke-width="2"/>
  <text x="705" y="116" font-size="14" font-weight="bold" fill="#190F33" text-anchor="middle">Node 3</text>
  <rect x="640" y="128" width="130" height="66" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="705" y="150" font-size="12" font-weight="bold" fill="#3498db" text-anchor="middle">Replica</text>
  <text x="705" y="166" font-size="12" fill="#3498db" text-anchor="middle">follower</text>
  <text x="705" y="184" font-size="11" fill="#3498db" text-anchor="middle">kept in sync</text>

  <!-- arrows from leaseholder to followers -->
  <line x1="260" y1="161" x2="385" y2="161" stroke="#6933FF" stroke-width="2"/>
  <polygon points="385,161 373,155 373,167" fill="#6933FF"/>
  <line x1="515" y1="161" x2="640" y2="161" stroke="#6933FF" stroke-width="2" stroke-dasharray="0"/>

  <!-- client arrow into leaseholder -->
  <line x1="195" y1="60" x2="195" y2="90" stroke="#190F33" stroke-width="2"/>
  <text x="195" y="252" font-size="12" fill="#190F33" text-anchor="middle">Your application's reads and writes</text>
  <text x="195" y="268" font-size="12" fill="#190F33" text-anchor="middle">go to the leaseholder first</text>

  <text x="450" y="320" font-size="13" font-weight="bold" fill="#190F33" text-anchor="middle">The lease can move to a different replica over time</text>
  <text x="450" y="340" font-size="12" fill="#190F33" text-anchor="middle">CockroachDB handles this automatically</text>
</svg>
