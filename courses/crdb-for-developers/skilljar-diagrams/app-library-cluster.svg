<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#190F33">From Your Code to the Cluster</text>

  <!-- App -->
  <rect x="30" y="120" width="210" height="140" rx="10" fill="#F4F2FF" stroke="#190F33" stroke-width="2"/>
  <text x="135" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#190F33">Your Application</text>

  <polygon points="250,180 290,168 290,192" fill="#190F33"/>

  <!-- Client library -->
  <rect x="300" y="90" width="300" height="200" rx="10" fill="#F4F2FF" stroke="#6933FF" stroke-width="3"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#6933FF">CockroachDB Client Library</text>
  <text x="450" y="155" text-anchor="middle" font-size="13" fill="#190F33">Connection pooling</text>
  <text x="450" y="185" text-anchor="middle" font-size="13" fill="#190F33">Transaction management</text>
  <text x="450" y="215" text-anchor="middle" font-size="13" fill="#190F33">Automatic retry on conflict</text>

  <polygon points="610,180 650,168 650,192" fill="#190F33"/>

  <!-- Cluster -->
  <rect x="660" y="120" width="210" height="140" rx="10" fill="#F4F2FF" stroke="#27ae60" stroke-width="3"/>
  <text x="765" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">CockroachDB Cluster</text>

  <circle cx="710" cy="200" r="22" fill="#27ae60"/>
  <text x="710" y="206" text-anchor="middle" font-size="12" fill="#ffffff">n1</text>
  <circle cx="765" cy="200" r="22" fill="#27ae60"/>
  <text x="765" y="206" text-anchor="middle" font-size="12" fill="#ffffff">n2</text>
  <circle cx="820" cy="200" r="22" fill="#27ae60"/>
  <text x="820" y="206" text-anchor="middle" font-size="12" fill="#ffffff">n3</text>
</svg>
