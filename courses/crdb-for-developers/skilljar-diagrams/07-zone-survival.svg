<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#190F33">Goal: Survive Zone Failure</text>

  <rect x="150" y="60" width="600" height="250" rx="10" fill="#F9F8F3" stroke="#6933FF" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#6933FF">Region: us-east</text>

  <!-- Zone a - UP -->
  <rect x="175" y="105" width="150" height="170" rx="8" fill="#F4F2FF" stroke="#27ae60" stroke-width="3"/>
  <text x="250" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#190F33">Zone a</text>
  <circle cx="250" cy="165" r="18" fill="#27ae60"/><text x="250" y="170" text-anchor="middle" font-size="11" fill="#ffffff">n1</text>
  <text x="250" y="200" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">&#10003; UP</text>

  <!-- Zone b - DOWN -->
  <rect x="375" y="105" width="150" height="170" rx="8" fill="#FCEAEA" stroke="#c0392b" stroke-width="3"/>
  <text x="450" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#190F33">Zone b</text>
  <circle cx="450" cy="165" r="18" fill="#c0392b"/><text x="450" y="170" text-anchor="middle" font-size="11" fill="#ffffff">n2</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">&#10007; DOWN</text>

  <!-- Zone c - UP -->
  <rect x="575" y="105" width="150" height="170" rx="8" fill="#F4F2FF" stroke="#27ae60" stroke-width="3"/>
  <text x="650" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#190F33">Zone c</text>
  <circle cx="650" cy="165" r="18" fill="#27ae60"/><text x="650" y="170" text-anchor="middle" font-size="11" fill="#ffffff">n3</text>
  <text x="650" y="200" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">&#10003; UP</text>

  <rect x="300" y="330" width="300" height="55" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="450" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Majority intact (zones a + c)</text>
  <text x="450" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Cluster stays UP</text>
</svg>
