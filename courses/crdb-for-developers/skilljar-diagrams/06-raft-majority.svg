<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#190F33">Majority Quorum: 2 of 3 Replicas Commit a Write</text>

  <!-- Proposed write -->
  <rect x="30" y="150" width="160" height="70" rx="8" fill="#F4F2FF" stroke="#6933FF" stroke-width="2"/>
  <text x="110" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#190F33">Write proposed</text>
  <text x="110" y="200" text-anchor="middle" font-size="12" fill="#190F33">by the leaseholder</text>

  <!-- Arrows to replicas -->
  <line x1="190" y1="170" x2="300" y2="110" stroke="#190F33" stroke-width="2"/>
  <polygon points="300,110 288,110 298,100" fill="#190F33"/>
  <line x1="190" y1="185" x2="300" y2="185" stroke="#190F33" stroke-width="2"/>
  <polygon points="300,185 288,180 288,190" fill="#190F33"/>
  <line x1="190" y1="200" x2="300" y2="280" stroke="#190F33" stroke-width="2"/>
  <polygon points="300,280 290,273 288,284" fill="#190F33"/>

  <!-- Node A -->
  <rect x="300" y="70" width="160" height="80" rx="8" fill="#F4F2FF" stroke="#27ae60" stroke-width="3"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#190F33">Node A (leaseholder)</text>
  <text x="380" y="118" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">&#10003; ACK</text>
  <text x="380" y="136" text-anchor="middle" font-size="12" fill="#190F33">Replica 1</text>

  <!-- Node B -->
  <rect x="300" y="145" width="160" height="80" rx="8" fill="#F4F2FF" stroke="#27ae60" stroke-width="3"/>
  <text x="380" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#190F33">Node B</text>
  <text x="380" y="193" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">&#10003; ACK</text>
  <text x="380" y="211" text-anchor="middle" font-size="12" fill="#190F33">Replica 2</text>

  <!-- Node C -->
  <rect x="300" y="240" width="160" height="80" rx="8" fill="#F9F8F3" stroke="#D9D6E8" stroke-width="2"/>
  <text x="380" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#190F33">Node C</text>
  <text x="380" y="288" text-anchor="middle" font-size="12" fill="#190F33">pending (catches up later)</text>
  <text x="380" y="306" text-anchor="middle" font-size="12" fill="#190F33">Replica 3</text>

  <!-- Majority bracket -->
  <path d="M 475 70 L 495 70 L 495 225 L 475 225" fill="none" stroke="#27ae60" stroke-width="3"/>
  <rect x="510" y="115" width="230" height="70" rx="8" fill="#F4F2FF" stroke="#27ae60" stroke-width="2"/>
  <text x="625" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Majority (2 of 3)</text>
  <text x="625" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">&#8594; WRITE COMMITS</text>
  <text x="625" y="178" text-anchor="middle" font-size="12" fill="#190F33">durable &amp; safe</text>

  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#190F33">A write commits as soon as a majority acknowledges it &#8212; the remaining replica can catch up later.</text>
</svg>
