<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#190F33">Tracing One Write Through the Stack</text>
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#190F33">INSERT INTO book ...</text>

  <line x1="25" y1="70" x2="25" y2="455" stroke="#190F33" stroke-width="2"/>
  <polygon points="25,465 18,452 32,452" fill="#190F33"/>

  <!-- Layer bars -->
  <rect x="50" y="70" width="560" height="70" rx="8" fill="#F4F2FF" stroke="#6933FF" stroke-width="2"/>
  <text x="330" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#190F33">SQL layer</text>

  <rect x="50" y="150" width="560" height="70" rx="8" fill="#F4F2FF" stroke="#3498db" stroke-width="2"/>
  <text x="330" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#190F33">Transactional layer</text>

  <rect x="50" y="230" width="560" height="70" rx="8" fill="#F4F2FF" stroke="#27ae60" stroke-width="2"/>
  <text x="330" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#190F33">Distribution layer</text>

  <rect x="50" y="310" width="560" height="70" rx="8" fill="#F4F2FF" stroke="#e67e22" stroke-width="2"/>
  <text x="330" y="350" text-anchor="middle" font-size="17" font-weight="bold" fill="#190F33">Replication layer</text>

  <rect x="50" y="390" width="560" height="70" rx="8" fill="#F4F2FF" stroke="#c0392b" stroke-width="2"/>
  <text x="330" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#190F33">Storage layer</text>

  <!-- Step callouts -->
  <line x1="610" y1="105" x2="640" y2="105" stroke="#190F33" stroke-width="1.5"/>
  <text x="645" y="100" font-size="13" fill="#190F33">Statement parsed</text>
  <text x="645" y="116" font-size="13" fill="#190F33">&amp; planned</text>

  <line x1="610" y1="185" x2="640" y2="185" stroke="#190F33" stroke-width="1.5"/>
  <text x="645" y="180" font-size="13" fill="#190F33">Txn opened, checked</text>
  <text x="645" y="196" font-size="13" fill="#190F33">for conflicts</text>

  <line x1="610" y1="265" x2="640" y2="265" stroke="#190F33" stroke-width="1.5"/>
  <text x="645" y="260" font-size="13" fill="#190F33">Routed to the</text>
  <text x="645" y="276" font-size="13" fill="#190F33">owning leaseholder</text>

  <line x1="610" y1="345" x2="640" y2="345" stroke="#190F33" stroke-width="1.5"/>
  <text x="645" y="340" font-size="13" fill="#190F33">Raft commits to a</text>
  <text x="645" y="356" font-size="13" fill="#190F33">majority of replicas</text>

  <line x1="610" y1="425" x2="640" y2="425" stroke="#190F33" stroke-width="1.5"/>
  <text x="645" y="420" font-size="13" fill="#190F33">Row persisted as</text>
  <text x="645" y="436" font-size="13" fill="#190F33">key-value bytes</text>
</svg>
