<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="sans-serif">
  <text x="450" y="34" font-size="18" font-weight="bold" fill="#190F33" text-anchor="middle">One Range, Three Replicas</text>
  <text x="450" y="56" font-size="13" fill="#190F33" text-anchor="middle">The same range is copied onto three different nodes</text>

  <rect x="370" y="78" width="160" height="56" rx="8" fill="#F4F2FF" stroke="#6933FF" stroke-width="3"/>
  <text x="450" y="102" font-size="13" font-weight="bold" fill="#6933FF" text-anchor="middle">Range: keys d9–f5</text>
  <text x="450" y="120" font-size="12" fill="#190F33" text-anchor="middle">part of the book table</text>

  <line x1="420" y1="134" x2="195" y2="200" stroke="#D9D6E8" stroke-width="2"/>
  <line x1="450" y1="134" x2="450" y2="200" stroke="#D9D6E8" stroke-width="2"/>
  <line x1="480" y1="134" x2="705" y2="200" stroke="#D9D6E8" stroke-width="2"/>

  <!-- node 1 -->
  <rect x="100" y="206" width="190" height="110" rx="10" fill="#F9F8F3" stroke="#D9D6E8" stroke-width="2"/>
  <text x="195" y="232" font-size="14" font-weight="bold" fill="#190F33" text-anchor="middle">Node 1</text>
  <rect x="130" y="246" width="130" height="50" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="195" y="268" font-size="12" font-weight="bold" fill="#3498db" text-anchor="middle">Replica</text>
  <text x="195" y="286" font-size="12" fill="#3498db" text-anchor="middle">d9–f5</text>

  <!-- node 2 -->
  <rect x="355" y="206" width="190" height="110" rx="10" fill="#F9F8F3" stroke="#D9D6E8" stroke-width="2"/>
  <text x="450" y="232" font-size="14" font-weight="bold" fill="#190F33" text-anchor="middle">Node 2</text>
  <rect x="385" y="246" width="130" height="50" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="450" y="268" font-size="12" font-weight="bold" fill="#3498db" text-anchor="middle">Replica</text>
  <text x="450" y="286" font-size="12" fill="#3498db" text-anchor="middle">d9–f5</text>

  <!-- node 3 -->
  <rect x="610" y="206" width="190" height="110" rx="10" fill="#F9F8F3" stroke="#D9D6E8" stroke-width="2"/>
  <text x="705" y="232" font-size="14" font-weight="bold" fill="#190F33" text-anchor="middle">Node 3</text>
  <rect x="640" y="246" width="130" height="50" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="705" y="268" font-size="12" font-weight="bold" fill="#3498db" text-anchor="middle">Replica</text>
  <text x="705" y="286" font-size="12" fill="#3498db" text-anchor="middle">d9–f5</text>

  <text x="450" y="344" font-size="13" fill="#190F33" text-anchor="middle">Three replicas on three different nodes — kept in sync for durability</text>
</svg>
